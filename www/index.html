<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#E9EAEE" />
  <title>ক্লাস রুটিন</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- লিকুইড গ্লাস আইকনের রং (লাইটে কালো কাচ, ডার্কে সাদা কাচ) আর নিচের মেনুর কাচের পাত -->
  <svg class="lg-defs" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="lgIcon" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>
    <linearGradient id="lgPlate" x1="0" y1="0" x2="0" y2="1"><stop class="p1" offset="0"/><stop class="p2" offset="1"/></linearGradient>
  </defs></svg>

  <!-- প্রথমবার লোড হওয়ার সময় দেখানো স্ক্রিন -->
  <div id="boot" class="boot">
    <div class="boot-logo">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g transform="translate(256 256) scale(1.5393) translate(-256 -256)"><path d="M103 169A66 66 0 0 1 169 103H200V200H103Z" fill="#FFBE5D"/><path d="M228 103H343A66 66 0 0 1 409 169V200H228Z" fill="#FF9160"/><path d="M103 228H200V409H169A66 66 0 0 1 103 343Z" fill="#59D1C9"/><path d="M228 228H409V343A66 66 0 0 1 343 409H228Z" fill="#70A8FF"/><path d="M277.3 309.8L306.6 339.6L362.4 283.3" fill="none" stroke="#FFFFFF" stroke-width="22.8" stroke-linecap="butt" stroke-linejoin="miter"/></g></svg>
    </div>
    <div class="boot-spinner" aria-label="Loading"></div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar" id="topbar">
      <img class="top-logo" id="topLogo" src="img/logo.svg" alt="" hidden/>
      <div class="topbar-text">
        <h1 id="topTitle"></h1>
        <p id="topSub"></p>
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>

    <main id="view" class="view"></main>

    <!-- নিচের মেনু: কাচের লম্বা পাত, বাছাই করা ট্যাব সবুজাভ কাচের পিলে নাম দেখায়;
         পিল গড়িয়ে নতুন ট্যাবে যায় আর লম্বা/ছোট হয়। ডানে আলাদা গোল কাচের "যোগ করুন" বোতাম। -->
    <nav class="lgnav" id="bottomNav">
      <div class="lgnav-bar">
        <span class="lgnav-pill" aria-hidden="true"></span>
        <button class="lg-tab" data-nav="today">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm-.75 3.5a.75.75 0 0 0-.75.75V12c0 .2.08.39.22.53l3 3a.75.75 0 1 0 1.06-1.06L12 11.69V8.25a.75.75 0 0 0-.75-.75Z"/></svg>
          <span class="lg-label" data-i18n="nav.today"></span>
        </button>
        <button class="lg-tab" data-nav="week">
          <svg viewBox="0 0 24 24"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1ZM4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9H4Zm3 2h3v3H7v-3Zm5 0h3v3h-3v-3Z"/></svg>
          <span class="lg-label" data-i18n="nav.week"></span>
        </button>
        <button class="lg-tab" data-nav="calendar">
          <svg viewBox="0 0 24 24" class="cal-icon" aria-hidden="true"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9ZM7.5 11.8a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Zm4.5 0a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Zm4.5 0a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Zm-9 3.9a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Zm4.5 0a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Z"/></svg>
          <span class="lg-label" data-i18n="nav.calendar"></span>
        </button>
        <button class="lg-tab" data-nav="notes">
          <svg viewBox="0 0 24 24" class="nt-icon" aria-hidden="true"><path d="M6 2.8h9.2L20 7.6V19a2.2 2.2 0 0 1-2.2 2.2H6A2.2 2.2 0 0 1 3.8 19V5A2.2 2.2 0 0 1 6 2.8Zm0 2a.2.2 0 0 0-.2.2v14c0 .1.1.2.2.2h11.8c.1 0 .2-.1.2-.2V8.6h-3.4a1.6 1.6 0 0 1-1.6-1.6V4.8H6Zm1.6 6.2h8.8v1.8H7.6V11Zm0 3.8h6.2v1.8H7.6v-1.8Z"/></svg>
          <span class="lg-label" data-i18n="nav.notes"></span>
        </button>
        <button class="lg-tab" data-nav="settings">
          <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm-1.6-8.5h3.2l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.6 2.8-2 1.7a6.9 6.9 0 0 1 0 1.9l2 1.7-1.6 2.8-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.2l-.5-2.6a6.6 6.6 0 0 1-1.7-.9l-2.5.9-1.6-2.8 2-1.7a6.9 6.9 0 0 1 0-1.9l-2-1.7 1.6-2.8 2.5.9c.5-.4 1.1-.7 1.7-.9l.5-2.6Z"/></svg>
          <span class="lg-label" data-i18n="nav.settings"></span>
        </button>
      </div>
      <button class="lg-tab lgnav-add" data-nav="add">
        <svg viewBox="0 0 24 24"><path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1Z"/></svg>
        <span class="lg-sr" data-i18n="nav.add"></span>
      </button>
    </nav>
    <button type="button" class="nt-fab" id="ntFab" data-action="nt-new" hidden><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
  </div>

  <!-- ডায়ালগ, শিট আর টোস্ট এখানে বসবে -->
  <div id="overlayRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="restoreInput" accept="application/json,.json,text/plain" hidden />

  <script src="lib/Sortable.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/localize.js"></script>
  <script src="js/store.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/export.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
