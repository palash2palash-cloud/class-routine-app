<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4F46E5" />
  <title>ক্লাস রুটিন</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- প্রথমবার লোড হওয়ার সময় দেখানো স্ক্রিন -->
  <div id="boot" class="boot">
    <div class="boot-logo">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="10" y="12" width="44" height="42" rx="8" fill="#fff"/>
        <rect x="10" y="12" width="44" height="12" rx="6" fill="#C7D2FE"/>
        <rect x="18" y="30" width="28" height="5" rx="2.5" fill="#4F46E5"/>
        <rect x="18" y="39" width="20" height="5" rx="2.5" fill="#14B8A6"/>
        <circle cx="48" cy="48" r="10" fill="#F59E0B"/>
        <path d="M48 42v6l4 3" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="boot-spinner" aria-label="Loading"></div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar" id="topbar">
      <div class="topbar-text">
        <h1 id="topTitle"></h1>
        <p id="topSub"></p>
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn" data-nav="today">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm-.75 3.5a.75.75 0 0 0-.75.75V12c0 .2.08.39.22.53l3 3a.75.75 0 1 0 1.06-1.06L12 11.69V8.25a.75.75 0 0 0-.75-.75Z"/></svg>
        <span data-i18n="nav.today"></span>
      </button>
      <button class="nav-btn" data-nav="week">
        <svg viewBox="0 0 24 24"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1ZM4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9H4Zm3 2h3v3H7v-3Zm5 0h3v3h-3v-3Z"/></svg>
        <span data-i18n="nav.week"></span>
      </button>
      <button class="nav-btn nav-add" data-nav="add">
        <span class="nav-add-circle">
          <svg viewBox="0 0 24 24"><path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1Z"/></svg>
        </span>
        <span data-i18n="nav.add"></span>
      </button>
      <button class="nav-btn" data-nav="settings">
        <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm-1.6-8.5h3.2l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.6 2.8-2 1.7a6.9 6.9 0 0 1 0 1.9l2 1.7-1.6 2.8-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.2l-.5-2.6a6.6 6.6 0 0 1-1.7-.9l-2.5.9-1.6-2.8 2-1.7a6.9 6.9 0 0 1 0-1.9l-2-1.7 1.6-2.8 2.5.9c.5-.4 1.1-.7 1.7-.9l.5-2.6Z"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>
  </div>

  <!-- ডায়ালগ, শিট আর টোস্ট এখানে বসবে -->
  <div id="overlayRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="restoreInput" accept="application/json,.json,text/plain" hidden />

  <script src="lib/Sortable.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
