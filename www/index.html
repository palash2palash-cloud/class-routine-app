<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#E9EAEE" />
  <title>ক্লাস রুটিন</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- লিকুইড গ্লাস আইকনের রং (লাইটে কালো কাচ, ডার্কে সাদা কাচ) আর নিচের মেনুর কাচের পাত -->
  <svg class="lg-defs" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="lgIcon" x1="0" y1="0" x2="0" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient>
    <linearGradient id="lgPlate" x1="0" y1="0" x2="0" y2="1"><stop class="p1" offset="0"/><stop class="p2" offset="1"/></linearGradient>
  </defs></svg>

  <!-- প্রথমবার লোড হওয়ার সময় দেখানো স্ক্রিন -->
  <div id="boot" class="boot">
    <div class="boot-logo">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g transform="translate(256 256) scale(1.5393) translate(-256 -256)"><path d="M103 169A66 66 0 0 1 169 103H200V200H103Z" fill="#FFBE5D"/><path d="M228 103H343A66 66 0 0 1 409 169V200H228Z" fill="#FF9160"/><path d="M103 228H200V409H169A66 66 0 0 1 103 343Z" fill="#59D1C9"/><path d="M228 228H409V343A66 66 0 0 1 343 409H228Z" fill="#70A8FF"/><path d="M277.3 309.8L306.6 339.6L362.4 283.3" fill="none" stroke="#FFFFFF" stroke-width="22.8" stroke-linecap="butt" stroke-linejoin="miter"/></g></svg>
    </div>
    <div class="boot-spinner" aria-label="Loading"></div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar" id="topbar">
      <img class="top-logo" id="topLogo" src="img/logo.svg" alt="" hidden/>
      <div class="topbar-text">
        <h1 id="topTitle"></h1>
        <p id="topSub"></p>
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>

    <main id="view" class="view"></main>

    <!-- নিচের মেনু: কাচের লম্বা পাত, বাছাই করা ট্যাব সবুজাভ কাচের পিলে নাম দেখায়;
         পিল গড়িয়ে নতুন ট্যাবে যায় আর লম্বা/ছোট হয়। ডানে আলাদা গোল কাচের "যোগ করুন" বোতাম। -->
    <nav class="lgnav" id="bottomNav">
      <div class="lgnav-bar">
        <span class="lgnav-pill" aria-hidden="true"></span>
        <button class="lg-tab" data-nav="today">
          <svg viewBox="0 0 24 24" class="lgi" aria-hidden="true"><path class="lgi-b" d="M2.8000000000000007 12a9.2 9.2 0 1 0 18.4 0a9.2 9.2 0 1 0 -18.4 0Z"/><path class="lgi-s" d="M2.8000000000000007 12a9.2 9.2 0 1 0 18.4 0a9.2 9.2 0 1 0 -18.4 0ZM12 7v5l3.2 2"/><path class="lgi-h" d="M6.2 8.6a7 7 0 0 1 3.4-3.3"/></svg>
          <span class="lg-label" data-i18n="nav.today"></span>
        </button>
        <button class="lg-tab" data-nav="week">
          <svg viewBox="0 0 24 24" class="lgi" aria-hidden="true"><path class="lgi-b" d="M7.6 3.4h8.799999999999999a4.2 4.2 0 0 1 4.2 4.2v8.799999999999999a4.2 4.2 0 0 1 -4.2 4.2h-8.799999999999999a4.2 4.2 0 0 1 -4.2 -4.2v-8.799999999999999a4.2 4.2 0 0 1 4.2 -4.2Z"/><path class="lgi-s" d="M7.6 3.4h8.799999999999999a4.2 4.2 0 0 1 4.2 4.2v8.799999999999999a4.2 4.2 0 0 1 -4.2 4.2h-8.799999999999999a4.2 4.2 0 0 1 -4.2 -4.2v-8.799999999999999a4.2 4.2 0 0 1 4.2 -4.2ZM3.4 8.7h17.2M8.9 3.4v17.2"/><path class="lgi-h" d="M5.6 6.1h1.4"/></svg>
          <span class="lg-label" data-i18n="nav.week"></span>
        </button>
        <button class="lg-tab" data-nav="calendar">
          <svg viewBox="0 0 24 24" class="lgi" aria-hidden="true"><path class="lgi-b" d="M6.2 4.5h11.6a3.2 3.2 0 0 1 3.2 3.2v10.1a3.2 3.2 0 0 1 -3.2 3.2h-11.6a3.2 3.2 0 0 1 -3.2 -3.2v-10.1a3.2 3.2 0 0 1 3.2 -3.2ZM3 7.7a3.2 3.2 0 0 1 3.2-3.2h11.6A3.2 3.2 0 0 1 21 7.7V10H3Z"/><path class="lgi-s" d="M6.2 4.5h11.6a3.2 3.2 0 0 1 3.2 3.2v10.1a3.2 3.2 0 0 1 -3.2 3.2h-11.6a3.2 3.2 0 0 1 -3.2 -3.2v-10.1a3.2 3.2 0 0 1 3.2 -3.2ZM8 2.6v3.6M16 2.6v3.6M3 10h18M7.6 14h.01M7.6 17.6h.01M11.6 14h.01M11.6 17.6h.01M13.5 15.8a2.3 2.3 0 1 0 4.6 0a2.3 2.3 0 1 0 -4.6 0Z"/><path class="lgi-h" d="M5.4 7.2h3"/></svg>
          <span class="lg-label" data-i18n="nav.calendar"></span>
        </button>
        <button class="lg-tab" data-nav="notes">
          <svg viewBox="0 0 24 24" class="lgi" aria-hidden="true"><path class="lgi-b" d="M14.6 2.8H7a2.4 2.4 0 0 0-2.4 2.4v13.6A2.4 2.4 0 0 0 7 21.2h10a2.4 2.4 0 0 0 2.4-2.4V7.6Z"/><path class="lgi-s" d="M14.6 2.8H7a2.4 2.4 0 0 0-2.4 2.4v13.6A2.4 2.4 0 0 0 7 21.2h10a2.4 2.4 0 0 0 2.4-2.4V7.6ZM14.4 2.9v3.3a1.6 1.6 0 0 0 1.6 1.6h3.3M8.4 11.4h7.2M8.4 15.2h7.2M8.4 7.6h2.6"/><path class="lgi-h" d="M6.8 6.4v3.4"/></svg>
          <span class="lg-label" data-i18n="nav.notes"></span>
        </button>
        <button class="lg-tab" data-nav="settings">
          <svg viewBox="0 0 24 24" class="lgi" aria-hidden="true"><path class="lgi-b" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><path class="lgi-s" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2ZM9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z"/><path class="lgi-h" d="M10.4 4.6h1.6"/></svg>
          <span class="lg-label" data-i18n="nav.settings"></span>
        </button>
      </div>
      <button class="lg-tab lgnav-add" data-nav="add">
        <svg viewBox="0 0 24 24" class="lgi" aria-hidden="true"><path class="lgi-b" d="M2.8000000000000007 12a9.2 9.2 0 1 0 18.4 0a9.2 9.2 0 1 0 -18.4 0Z"/><path class="lgi-s" d="M12 7v10M7 12h10"/><path class="lgi-h" d="M6.2 8.6a7 7 0 0 1 3.4-3.3"/></svg>
        <span class="lg-sr" data-i18n="nav.add"></span>
      </button>
    </nav>
    <button type="button" class="nt-fab" id="ntFab" data-action="nt-new" hidden><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
  </div>

  <!-- ডায়ালগ, শিট আর টোস্ট এখানে বসবে -->
  <div id="overlayRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="restoreInput" accept="application/json,.json,text/plain" hidden />

  <script src="lib/Sortable.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/localize.js"></script>
  <script src="js/store.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/export.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
